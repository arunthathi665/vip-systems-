<!DOCTYPE html>
<html>
<head>
<title>VIP SYSTEMS</title>

<style>
    body {
        font-family: Arial;
        background: #f2f2f2;
        padding: 20px;
    }

    h1 {
        color: green;
        text-align: center;
    }

    .box {
        background: white;
        padding: 20px;
        border-radius: 10px;
        width: 350px;
        margin: auto;
        box-shadow: 0 0 10px #ccc;
    }

    input, select {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border-radius: 5px;
        border: 1px solid #aaa;
    }

    button {
        background: green;
        color: white;
        padding: 10px;
        border-radius: 10px;
        width: 100%;
        margin-top: 15px;
        border: none;
        font-size: 16px;
    }

    table {
        width: 100%;
        margin-top: 30px;
        border-collapse: collapse;
    }

    th, td {
        border: 1px solid #999;
        padding: 10px;
        text-align: center;
    }

    th {
        background: green;
        color: white;
    }
</style>
</head>

<body>

<h1>VIP SYSTEMS</h1>

<div class="box">
    <input id="name" placeholder="Customer Name">
    <input id="mobile" placeholder="Mobile Number">
        <input id="status" placeholder="Status">

  


    <button onclick="saveLead()">Save Lead</button>
</div>

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Mobile</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody id="result"></tbody>
</table>

<script>
function saveLead() {
    let name = document.getElementById("name").value;
    let mobile = document.getElementById("mobile").value;
    let status = document.getElementById("status").value;

    if(name === "" || mobile === "" || status === ""){
        alert("Please fill all fields");
        return;
    }

    let row = "<tr><td>" + name + "</td><td>" + mobile + "</td><td>" + status + "</td></tr>";
    document.getElementById("result").innerHTML += row;

    alert("Saved Successfully");

    document.getElementById("name").value = "";
    document.getElementById("mobile").value = "";
    document.getElementById("status").value = "";
}
</script>

</body>
</html>
